
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>InspireWall – Google Login</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#f5f5f5;
    }
    button{
      padding:12px 20px;
      font-size:16px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      background:#4285F4;
      color:white;
    }
  </style>
</head>
<body>

  <button id="googleBtn">Sign in with Google</button>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } 
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // 🔥 Firebase config (tumhara)
    const firebaseConfig = {
      apiKey: "AIzaSyAOIee5CL1PhzPZQkIBSzux9u6DRPeXYe8",
      authDomain: "aman-3ee64.firebaseapp.com",
      projectId: "aman-3ee64",
      storageBucket: "aman-3ee64.firebasestorage.app",
      messagingSenderId: "134662250108",
      appId: "1:134662250108:web:e3b7b111ec081f97b7b3f9",
      measurementId: "G-1K5Z5CCV99"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Google Login
    document.getElementById("googleBtn").addEventListener("click", () => {
      signInWithPopup(auth, provider)
        .then((result) => {
          const user = result.user;
          alert("Welcome " + user.displayName);
          console.log(user);

          // 👉 redirect (optional)
          // window.location.href = "home.html";
        })
        .catch((error) => {
          console.log(error);
          alert("Login failed");
        });
    });
  </script>

</body>
</html>
